<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,user-scalable=no">
    <title>Loan History</title>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js"></script>
</head>
<style>
/* Green theme styles */
body {
    background-color: #e8f5e9;
}
.btn-link {
    color: #28a745;
}
h4 {
    color: #28a745;
}
.loan-entry {
    background-color: #f1f8e9;
    border: 1px solid #c8e6c9;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 5px;
}
</style>
<body>

<button class="btn btn-link" onclick="window.location.href='index.html'">
    <i class="fas fa-arrow-left"></i>
</button>

<!-- Loan History Section -->
<div class="container mt-4">
    <div id="loan-history" style="margin-top: 20px;">
        <h4>Loan History</h4>
        <div id="loan-history-body">
            <!-- Loan records will be dynamically inserted here -->
        </div>
    </div>
</div>

<!-- Include SweetAlert2 for notifications -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    // Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyCdzQP6n7gw8T82h2Qg-cLfnLbEqJ4WONg",
        authDomain: "caps-62ee2.firebaseapp.com",
        databaseURL: "https://caps-62ee2-default-rtdb.firebaseio.com",
        projectId: "caps-62ee2",
        storageBucket: "caps-62ee2.appspot.com",
        messagingSenderId: "407248916382",
        appId: "1:407248916382:web:104a66db2e652789e2d08f",
        measurementId: "G-2Y9GYDHFVM"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // Check if the user is logged in, and if not, redirect to login
    firebase.auth().onAuthStateChanged(function(user) {
        if (!user) {
            window.location.href = 'login.html';
        } else {
            fetchLoanHistory(user.uid);
        }
    });

    // Function to fetch and display the loan history in plain text format
    function fetchLoanHistory(userId) {
        const loanHistoryRef = db.ref(`users/${userId}/loanHistory`);

        loanHistoryRef.once('value', (snapshot) => {
            const loanHistoryBody = document.getElementById('loan-history-body');
            loanHistoryBody.innerHTML = ''; // Clear existing entries

            if (snapshot.exists()) {
                const loansArray = snapshot.val();

                loansArray.forEach((loan, index) => {
                    const loanEntry = document.createElement('div');
                    loanEntry.classList.add('loan-entry');
                    loanEntry.innerHTML = `
                        <strong>Loan #${index + 1}</strong><br>
                        <strong>Date:</strong> ${loan.date}<br>
                        <strong>Loan ID:</strong> ${loan.loanId}<br>
                        <strong>Previous Loan Amount:</strong> ${loan.previousLoanAmount}<br>
                        <strong>New Loan Amount:</strong> ${loan.newLoanAmount}<br>
                        <strong>Total Loan Amount:</strong> ${loan.totalLoanAmount}<br>
                        <strong>Payment Amount:</strong> ${loan.paymentAmount}<br>
                        <strong>Interest:</strong> ${loan.interest}<br>
                    `;
                    loanHistoryBody.appendChild(loanEntry);
                });
            } else {
                const noHistory = document.createElement('div');
                noHistory.classList.add('text-center', 'text-muted');
                noHistory.innerHTML = "No loan history available.";
                loanHistoryBody.appendChild(noHistory);
            }
        }).catch(error => {
            console.error("Error fetching loan history: ", error);
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'Failed to fetch loan history. Please try again later.'
            });
        });
    }
</script>

<!-- Bootstrap JS (Optional) -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
