<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Proof of Billing</title>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-storage.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js"></script>

    <style>
        /* Stylish background and form */
        body {
            background-color: #e8f5e9;
            font-family: 'Arial', sans-serif;
            padding: 30px;
        }
        .btn-link {
    color: #28a745;
}
.btn-primary {
    background-color: #28a745;
    border-color: #28a745;
}
.btn-primary:hover {
    background-color: #218838;
    border-color: #218838;
}

        .container {
            max-width: 600px;
            margin: auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-size: 24px;
            color: #2e7d32;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }

        .text-center {
            text-align: center;
        }

        .form-group label {
            font-weight: bold;
            color: #333;
        }

        #uploadFileBtn {
            background-color: #2e7d32;
            border: none;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        #uploadFileBtn:hover {
            background-color: #388e3c;
        }

#imageBox {
    display: none;
    width: 100%;
    max-width: 300px; /* Set maximum width */
    height: auto; /* Adjust height to maintain aspect ratio */
    border: 2px solid #2e7d32;
    overflow: hidden;
    margin-top: 20px;
    border-radius: 8px;
    background-color: #f1f8e9;
    position: relative;
    text-align: center;
}

#imageBox img {
    width: 100%;
    height: auto; /* Maintain aspect ratio */
    object-fit: cover; /* Crop image to fit the box */
    border-radius: 8px;
}


        .note-text {
            margin-top: 20px;
            font-size: 16px;
            color: #666;
            text-align: center;
        }

        .note-text p {
            margin: 0;
        }
    </style>
</head>
<body>
      <!-- Back Button -->
    <button class="btn btn-link" onclick="window.location.href='index.html'">
        <i class="fas fa-arrow-left"></i>
    </button>
<div class="container">
    <h2>Upload Your Proof of Billing</h2>
    
    <div class="text-center">
        <p class="note-text">This Proof of Billing is required for loan approval. It helps verify your current address for the loan company’s review.</p>
    </div>

    <!-- File Upload -->
    <div class="form-group">
        <label for="fileInput">Upload Proof of Billing</label>
        <input type="file" class="form-control" id="fileInput" />
    </div>
    
    <!-- Upload Button -->
    <button type="button" class="btn" id="uploadFileBtn">Upload File</button>

    <!-- Image Display Box (Square Container) -->
    <div id="imageBox">
        <h4>Uploaded Image:</h4>
        <img id="uploadedImage" class="img-fluid" alt="Uploaded Image" />
    </div>
</div>

<script>
    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyCdzQP6n7gw8T82h2Qg-cLfnLbEqJ4WONg",
        authDomain: "caps-62ee2.firebaseapp.com",
        databaseURL: "https://caps-62ee2-default-rtdb.firebaseio.com",
        projectId: "caps-62ee2",
        storageBucket: "caps-62ee2.appspot.com",
        messagingSenderId: "407248916382",
        appId: "1:407248916382:web:104a66db2e652789e2d08f",
        measurementId: "G-2Y9GYDHFVM"
    };
    firebase.initializeApp(firebaseConfig);
    const storage = firebase.storage();
    const auth = firebase.auth();
    const database = firebase.database();

    // Function to handle user login state and fetch user data
    auth.onAuthStateChanged(function (user) {
        if (user) {
            const userId = user.uid;
            console.log('User is logged in:', userId);
            // Check if an image already exists for the user
            checkForExistingImage(userId);
        } else {
            alert('Please log in to upload files.');
        }
    });

    // Check if the user has already uploaded an image
    function checkForExistingImage(userId) {
        const storageRef = storage.ref(`proofs_of_billing/${userId}/proof.jpg`);
        storageRef.getDownloadURL()
            .then(function (url) {
                // If the image exists, show it
                const imageBox = document.getElementById('imageBox');
                const uploadedImage = document.getElementById('uploadedImage');

                uploadedImage.src = url;
                imageBox.style.display = 'block'; // Show the image box
                document.getElementById('fileInput').disabled = true; // Disable file input after upload
                document.getElementById('uploadFileBtn').disabled = true; // Disable upload button after upload
            })
            .catch(function (error) {
                console.log('No image found for this user');
            });
    }

    // Handle file upload
    document.getElementById('uploadFileBtn').addEventListener('click', function () {
        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];

        if (!file) {
            alert('Please select a file to upload.');
            return;
        }

        const user = auth.currentUser;
        if (user) {
            const userId = user.uid;
            const storageRef = storage.ref(`proofs_of_billing/${userId}/proof.jpg`);

            const uploadTask = storageRef.put(file);

            uploadTask.on('state_changed', function (snapshot) {
                const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                console.log('Upload is ' + progress + '% done');
            }, function (error) {
                console.error('Error uploading file:', error);
                alert('There was an issue uploading the file.');
            }, function () {
                uploadTask.snapshot.ref.getDownloadURL().then(function (downloadURL) {
                    console.log('File available at', downloadURL);
                    alert('File uploaded successfully!');

                    // Save proof URL in Realtime Database
                    const userRef = database.ref(`users/${userId}`);
                    userRef.update({
                        proofUrl: downloadURL
                    });

                    // Show the uploaded image
                    const imageBox = document.getElementById('imageBox');
                    const uploadedImage = document.getElementById('uploadedImage');

                    uploadedImage.src = downloadURL;
                    imageBox.style.display = 'block'; // Show the image box

                    // Disable the upload functionality to prevent further uploads
                    document.getElementById('fileInput').disabled = true;
                    document.getElementById('uploadFileBtn').disabled = true;
                });
            });
        } else {
            alert('Please log in to upload a file.');
        }
    });
</script>

<!-- Bootstrap JS (Optional) -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
