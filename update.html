<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,user-scalable=no">
    <title>Update Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js"></script>
    <style>
        body {
            background-color: #e8f5e9;
        }
        .container {
            margin-top: 50px;
        }
    </style>
</head>
<body>
<div class="container">
    <h3 class="text-center text-success">Update Profile</h3>
    <form id="update-form">
        <div class="form-group">
            <label>First Name</label>
            <input type="text" id="firstName" class="form-control">
        </div>
        <div class="form-group mt-3">
            <label>Last Name</label>
            <input type="text" id="lastName" class="form-control">
        </div>
        <div class="form-group mt-3">
            <label>Address</label>
            <input type="text" id="address" class="form-control">
        </div>
        <div class="form-group mt-3">
            <label>Contact</label>
            <input type="text" id="contact" class="form-control">
        </div>
        <div class="form-group mt-3">
            <label>Occupation</label>
            <input type="text" id="occupation" class="form-control">
        </div>
        <button type="button" class="btn btn-success mt-4 w-100" onclick="updateProfile()">Update</button>
    </form>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCdzQP6n7gw8T82h2Qg-cLfnLbEqJ4WONg",
        authDomain: "caps-62ee2.firebaseapp.com",
        databaseURL: "https://caps-62ee2-default-rtdb.firebaseio.com",
        projectId: "caps-62ee2",
        storageBucket: "caps-62ee2.appspot.com",
        messagingSenderId: "407248916382",
        appId: "1:407248916382:web:104a66db2e652789e2d08f",
        measurementId: "G-2Y9GYDHFVM"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // Fetch and prefill user data
    firebase.auth().onAuthStateChanged(function(user) {
        if (user) {
            db.ref('users/' + user.uid).once('value').then(snapshot => {
                const userData = snapshot.val();
                $('#firstName').val(userData.firstName);
                $('#lastName').val(userData.lastName);
                $('#address').val(userData.address);
                $('#contact').val(userData.contact);
                $('#occupation').val(userData.occupation);
            });
        } else {
            window.location.href = 'login.html';
        }
    });

    // Update user data
    function updateProfile() {
        const user = auth.currentUser;
        if (user) {
            const updatedData = {
                firstName: $('#firstName').val(),
                lastName: $('#lastName').val(),
                address: $('#address').val(),
                contact: $('#contact').val(),
                occupation: $('#occupation').val()
            };

            db.ref('users/' + user.uid).update(updatedData)
                .then(() => {
                    Swal.fire({
                        icon: 'success',
                        title: 'Profile Updated',
                        text: 'Your profile details have been updated successfully!'
                    }).then(() => {
                        window.location.href = 'profile.html';
                    });
                })
                .catch(error => {
                    Swal.fire({
                        icon: 'error',
                        title: 'Update Failed',
                        text: error.message
                    });
                });
        }
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
